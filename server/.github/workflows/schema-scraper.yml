name: Schema Auto-Scraper

on:
  schedule:
    - cron: '0 3 */14 * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install deps
        run: pip install pillow httpx
        
      - name: Run scraper
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cd server
          python schema_image_scraper.py
          
      - name: Commit new images
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add server/schema_images/
          git diff --staged --quiet || git commit -m "auto: schema images $(date +%F)"
          git push
