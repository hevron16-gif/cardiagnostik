name: Build MAUI Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия APK'
        required: true
        default: '1.0.15'

jobs:
  build-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet workload install maui-android
      - run: dotnet restore mobile/CarDiagnosticApp.csproj
      - run: |
          dotnet publish mobile/CarDiagnosticApp.csproj `
            -f net8.0-android -c Release `
            -p:AndroidPackageFormat=apk `
            -p:ApplicationVersion=${{ github.event.inputs.version }} `
            -o output
      - uses: actions/upload-artifact@v4
        with:
          name: CarDiagnosticApp-APK
          path: output/*.apk
