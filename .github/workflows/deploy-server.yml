name: Deploy Server to Render

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'render.yaml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

      - name: Verify deployment
        run: |
          # Render собирает и перезапускает сервис 2-10 минут — ждём с ретраями
          for i in $(seq 1 60); do
            if curl -sf "${{ secrets.SERVER_HEALTH_URL }}/health" > /dev/null; then
              echo "Deploy OK"
              exit 0
            fi
            echo "Ожидание деплоя... ($i/60)"
            sleep 10
          done
          echo "Деплой не подтвердился за 10 минут"
          exit 1
